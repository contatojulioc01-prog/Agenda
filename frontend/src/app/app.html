<div class="app-content" [attr.aria-hidden]="loadingVisible() ? 'true' : null">
  <router-outlet />
</div>

@if (loadingVisible()) {
  <section
    class="startup-loader"
    [class.is-leaving]="loadingLeaving()"
    role="status"
    aria-live="polite"
    aria-label="Carregando sua agenda"
  >
    <div class="loader-glow loader-glow-one"></div>
    <div class="loader-glow loader-glow-two"></div>

    <div class="loader-card">
      <div class="brand-mark" aria-hidden="true">
        <span class="orbit orbit-one"></span>
        <span class="orbit orbit-two"></span>
        <svg viewBox="0 0 64 64" focusable="false">
          <rect class="calendar-page" x="12" y="15" width="40" height="38" rx="11" />
          <path class="calendar-header" d="M13 27h38" />
          <path class="calendar-ring" d="M23 11v9M41 11v9" />
          <path class="calendar-check" d="m23 39 6 6 13-15" />
        </svg>
      </div>

      <div class="loader-copy">
        <span class="loader-eyebrow">Agenda</span>
        <h1>Organizando seu dia</h1>
        <p>Preparando compromissos e tarefas<span class="typing-dots" aria-hidden="true"><i></i><i></i><i></i></span></p>
      </div>

      <div class="progress-track" aria-hidden="true">
        <span></span>
      </div>
    </div>

    <p class="loader-footnote">Tudo pronto em alguns instantes</p>
  </section>
}

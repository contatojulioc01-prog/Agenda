<div class="view-week">
  <!-- Cabeçalho da semana -->
  <div class="week-header">
    <div class="week-time-gutter-header"></div>
    <div
      *ngFor="let day of weekDays"
      class="week-day-header"
      [class.today]="day.isToday"
      [class.weekend]="day.isWeekend"
      [class.holiday]="!!day.holiday"
      (click)="dayClick.emit(day.dateStr)"
      (contextmenu)="$event.preventDefault(); dayContextMenu.emit({ date: day.dateStr, mouseEvent: $event })"
      [matTooltip]="day.holiday?.name ?? ''"
    >
      <span class="week-day-label">{{ day.dayLabel }}</span>
      <span class="week-day-number">{{ day.dayNum }}</span>
      <span *ngIf="day.holiday" class="week-holiday-dot" title="Feriado">🎌</span>
    </div>
  </div>

  <!-- Body com grade de horas -->
  <div class="week-body">
    <!-- Coluna de horas -->
    <div class="week-time-col">
      <div *ngFor="let h of HOURS" class="time-label">{{ formatHour(h) }}</div>
    </div>

    <!-- Colunas dos dias -->
    <div
      *ngFor="let day of weekDays"
      #colRef
      class="week-day-col"
      [attr.data-date]="day.dateStr"
      (dragenter)="onDragEnter($event, colRef)"
      (dragover)="onDragOver($event, colRef)"
      (dragleave)="onDragLeave($event, colRef)"
      (drop)="onDrop($event, day, colRef)"
      (click)="dayClick.emit(day.dateStr)"
      (contextmenu)="$event.preventDefault(); dayContextMenu.emit({ date: day.dateStr, mouseEvent: $event })"
    >
      <!-- Linhas de hora -->
      <div *ngFor="let h of HOURS" class="hour-row">
        <div class="half-hour-line"></div>
      </div>

      <!-- Linha de hora atual (apenas coluna hoje) -->
      <div
        *ngIf="day.isToday"
        class="current-time-line"
        [style.top.px]="currentTimeTop"
      ></div>

      <!-- Eventos posicionados com cálculo de sobreposição e redimensionamento -->
      <div
        *ngFor="let ev of day.positionedEvents"
        class="week-event"
        [class.system-event]="ev.isSystem"
        [class.task-deadline]="ev.isTaskDeadline"
        [class.is-resizing]="resizingEventId === ev.id"
        [style.top.px]="ev.top"
        [style.height.px]="ev.height"
        [style.left]="'calc(' + ev.left + '% + 2px)'"
        [style.width]="'calc(' + ev.width + '% - 4px)'"
        [style.z-index]="resizingEventId === ev.id ? 100 : (10 + ev.column)"
        [style.background]="colorMap[ev.color]"
        [attr.draggable]="isResizing || ev.isSystem || (ev.endDate && ev.endDate !== ev.date) ? null : true"
        (dragstart)="onDragStart($event, ev)"
        (dragend)="onDragEnd($event)"
        (click)="$event.stopPropagation(); onCardClick($event, ev)"
        (contextmenu)="$event.preventDefault(); $event.stopPropagation(); eventContextMenu.emit({ event: ev, mouseEvent: $event })"
        [matTooltip]="ev.title + ' · ' + ev.startTime + ' - ' + ev.endTime + (ev.endDate && ev.endDate !== ev.date ? ' (' + ev.date + ' até ' + ev.endDate + ')' : '') + (ev.isTaskDeadline ? ' · Clique para abrir o card em Tarefas' : '')"
      >
        <!-- Alça de Redimensionamento Esquerda (Dias) -->
        <div
          *ngIf="!ev.isSystem"
          class="event-resize-handle-x left"
          (mousedown)="onResizeHorizontalStart($event, ev, 'left')"
          title="Arrastar para esquerda/direita para alterar dia de início"
        ></div>

        <!-- Alça de Redimensionamento Superior (Horário de Início deste dia) -->
        <div
          *ngIf="!ev.isSystem"
          class="event-resize-handle top"
          (mousedown)="onResizeStart($event, ev, colRef, 'top', day.dateStr)"
          title="Arrastar para alterar horário de início deste dia"
        ></div>

        <div class="ev-title-row">
          <span class="ev-title">{{ ev.title }}</span>
          <span *ngIf="ev.endDate && ev.endDate !== ev.date" class="multi-day-badge">📅</span>
        </div>
        <div class="ev-time" *ngIf="ev.height >= 32">
          {{ ev.startTime }} – {{ ev.endTime }}
        </div>

        <!-- Alça de Redimensionamento Inferior (Horário de Término deste dia) -->
        <div
          *ngIf="!ev.isSystem"
          class="event-resize-handle bottom"
          (mousedown)="onResizeStart($event, ev, colRef, 'bottom', day.dateStr)"
          title="Arrastar para alterar horário de término deste dia"
        ></div>

        <!-- Alça de Redimensionamento Direita (Dias) -->
        <div
          *ngIf="!ev.isSystem"
          class="event-resize-handle-x right"
          (mousedown)="onResizeHorizontalStart($event, ev, 'right')"
          title="Arrastar para esquerda/direita para alterar dia de término"
        ></div>
      </div>
    </div>

    <!-- Eventos de vários dias usam uma única barra contínua sobre as colunas. -->
    <div class="week-multiday-layer">
      <div
        *ngFor="let span of multiDaySpans"
        class="week-event week-multiday-event"
        [class.system-event]="span.event.isSystem"
        [class.task-deadline]="span.event.isTaskDeadline"
        [class.is-resizing]="resizingEventId === span.event.id"
        [style.left.%]="span.left"
        [style.width.%]="span.width"
        [style.top.px]="span.top"
        [style.height.px]="span.height"
        [style.background]="colorMap[span.event.color]"
        (click)="$event.stopPropagation(); onCardClick($event, span.event)"
        (contextmenu)="$event.preventDefault(); $event.stopPropagation(); eventContextMenu.emit({ event: span.event, mouseEvent: $event })"
        [matTooltip]="span.event.title + ' · ' + span.event.startTime + ' - ' + span.event.endTime + (span.event.isTaskDeadline ? ' · Clique para abrir o card em Tarefas' : '')"
      >
        <div *ngIf="!span.event.isSystem" class="event-resize-handle-x left" (mousedown)="onResizeHorizontalStart($event, span.event, 'left')"></div>
        <div class="ev-title-row"><span class="ev-title">{{ span.event.title }}</span></div>
        <div class="ev-time" *ngIf="span.height >= 32">{{ span.event.startTime }} – {{ span.event.endTime }}</div>
        <div *ngIf="!span.event.isSystem" class="event-resize-handle-x right" (mousedown)="onResizeHorizontalStart($event, span.event, 'right')"></div>
      </div>
    </div>
  </div>
</div>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="-110 200 910 630" width="910" height="630" role="img" aria-label="Livro Doce Brinquedo abrindo" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
.db-w{animation:db-slide .53s .22s cubic-bezier(.65,0,.35,1) both}
@keyframes db-slide{from{transform:translateX(-178px)}to{transform:translateX(0)}}
.db-c{animation:db-flip .53s .22s cubic-bezier(.65,0,.35,1) both}
@keyframes db-flip{from{transform:scaleX(1)}to{transform:scaleX(-1)}}
.db-f{animation:db-out .53s .22s linear both}
@keyframes db-out{0%,49%{opacity:1}50%,100%{opacity:0}}
.db-i{animation:db-in .53s .22s linear both}
@keyframes db-in{0%,49%{opacity:0}50%,100%{opacity:1}}
.db-e{opacity:0;animation:db-fade .22s ease-out forwards}
@keyframes db-fade{to{opacity:1}}
.db-h{transform-box:fill-box;transform-origin:center;animation:db-hop .35s ease-out both}
@keyframes db-hop{0%{transform:none}40%{transform:translateY(-34px) rotate(20deg) scale(1.15)}70%{transform:translateY(4px) rotate(-8deg) scale(.95)}100%{transform:none}}
:root:has(#db-closed:target) .db-w{animation:none;transform:translateX(-178px)}
:root:has(#db-closed:target) .db-c{animation:none;transform:scaleX(1)}
:root:has(#db-closed:target) .db-f{animation:none;opacity:1}
:root:has(#db-closed:target) .db-i{animation:none;opacity:0}
:root:has(#db-closed:target) .db-e{animation:none;opacity:0}
:root:has(#db-closed:target) .db-h{animation:none;transform:none}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-delay:0s!important}}
</style>
<g id="db-closed"></g>
<defs>
<pattern id="db-g" x="372" y="380" width="47.3" height="70" patternUnits="userSpaceOnUse"><rect width="47.3" height="70" fill="none" stroke="#f6d3a5" stroke-width="2"/></pattern>
<pattern id="db-q" x="447" y="430" width="28" height="27" patternUnits="userSpaceOnUse"><rect width="20" height="19" rx="2" fill="#fbcb8e" opacity=".85"/></pattern>
<g id="db-r"><path d="M268 0H336" stroke="#2f9bd8" stroke-width="17" stroke-linecap="round"/><circle cx="318" r="7" fill="#fff"/></g>
</defs>

<g class="db-w">
  <!-- verso do livro (lado esquerdo, aparece ao abrir) -->
  <rect class="db-i" x="-67" y="322" width="357" height="473" rx="28" fill="#fff" stroke="#ee7420" stroke-width="14"/>
  <!-- verso do livro (lado direito) -->
  <rect x="318" y="322" width="437" height="473" rx="28" fill="#fff" stroke="#ee7420" stroke-width="14"/>
  <!-- página direita: agenda -->
  <rect x="357" y="322" width="361" height="431" fill="#fff"/>
  <rect x="357" y="322" width="361" height="50" fill="#2f9bd8"/>
  <rect x="372" y="380" width="331" height="350" fill="url(#db-g)"/>
  <rect class="db-e" style="animation-delay:1.7s" x="376" y="456" width="40" height="18" rx="5" fill="#f39a20"/>
  <rect class="db-e" style="animation-delay:1.85s" x="471" y="526" width="40" height="18" rx="5" fill="#2f9bd8"/>
  <rect class="db-e" style="animation-delay:2s" x="566" y="596" width="40" height="18" rx="5" fill="#e6118a"/>
  <rect class="db-e" style="animation-delay:2.15s" x="376" y="666" width="40" height="18" rx="5" fill="#fbc11d"/>

  <!-- capa que gira em torno da lombada -->
  <g transform="translate(345 0)"><g class="db-c">
    <rect x="0" y="300" width="385" height="465" rx="28" fill="#f39a20"/>
    <g class="db-i">
      <rect x="12" y="322" width="361" height="431" fill="#fff"/>
    </g>
    <g class="db-f" transform="translate(-345 0)">
      <rect x="358" y="382" width="354" height="378" rx="18" fill="#fff"/>
    </g>
  </g></g>

  <!-- lombada e espirais -->
  <rect x="290" y="300" width="55" height="465" rx="18" fill="#2f9bd8"/>
  <use href="#db-r" y="365"/><use href="#db-r" y="445"/><use href="#db-r" y="523"/><use href="#db-r" y="610"/><use href="#db-r" y="695"/>

  <!-- estrelas e bolinha: pulam quando o livro abre -->
  <g class="db-h" style="animation-delay:1s"><circle cx="466" cy="342" r="42" fill="#e6118a" stroke="#fff" stroke-width="8" paint-order="stroke"/></g>
  <g class="db-h" style="animation-delay:1.1s"><g transform="translate(485 265) scale(28)"><polygon points="0,-1 .247,-.34 .951,-.309 .399,.13 .588,.809 0,.42 -.588,.809 -.399,.13 -.951,-.309 -.247,-.34" fill="#ee7420" stroke="#fff" stroke-width=".18" paint-order="stroke"/></g></g>
  <g class="db-h" style="animation-delay:1.2s"><g transform="translate(551 245) scale(22)"><polygon points="0,-1 .247,-.34 .951,-.309 .399,.13 .588,.809 0,.42 -.588,.809 -.399,.13 -.951,-.309 -.247,-.34" fill="#2f9bd8" stroke="#fff" stroke-width=".22" paint-order="stroke"/></g></g>
  <g class="db-h" style="animation-delay:1.3s"><g transform="translate(575 330) scale(62)"><polygon points="0,-1 .247,-.34 .951,-.309 .399,.13 .588,.809 0,.42 -.588,.809 -.399,.13 -.951,-.309 -.247,-.34" fill="#fbc11d" stroke="#fff" stroke-width=".14" paint-order="stroke"/></g></g>
</g>
</svg>

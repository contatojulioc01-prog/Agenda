<div class="view-month">
  <!-- Cabeçalho dias da semana -->
  <div class="month-dow-header">
    <div
      *ngFor="let d of DOW; let i = index"
      class="month-dow-cell"
      [class.weekend-col]="i === 0 || i === 6"
    >{{ d }}</div>
  </div>

  <!-- Grade do mês -->
  <div class="month-grid">
    <ng-container *ngFor="let week of weeks">
      <div
        *ngFor="let day of week"
        class="day-cell"
        [class.other-month]="!day.isCurrentMonth"
        [class.today-cell]="day.isToday"
        [class.weekend-cell]="day.isWeekend && !day.isToday && !day.holiday"
        [class.holiday-cell]="!!day.holiday"
        (click)="dayClick.emit(day.dateStr)"
        (dragover)="onDragOver($event, $any($event.currentTarget))"
        (dragleave)="onDragLeave($any($event.currentTarget))"
        (drop)="onDrop($event, day, $any($event.currentTarget))"
      >
        <!-- Número do dia -->
        <span class="day-number">{{ day.dayNum }}</span>

        <!-- Tag feriado -->
        <span *ngIf="day.holiday" class="holiday-tag" [matTooltip]="day.holiday.name">
          🎌 {{ day.holiday.name | slice:0:18 }}{{ day.holiday.name.length > 18 ? '…' : '' }}
        </span>

        <!-- Eventos -->
        <div class="day-events">
          <ng-container *ngFor="let ev of day.events; let i = index">
            <div
              *ngIf="i < 3"
              class="event-pill"
              [style.background]="colorMap[ev.color]"
              draggable="true"
              (dragstart)="onDragStart($event, ev)"
              (dragend)="onDragEnd($event)"
              (click)="$event.stopPropagation(); eventClick.emit(ev)"
              [matTooltip]="ev.title + (ev.allDay ? '' : ' · ' + ev.startTime + ' - ' + ev.endTime)"
            >
              <span *ngIf="!ev.allDay" class="event-time">{{ ev.startTime }}</span>
              <span class="event-title">{{ ev.title }}</span>
            </div>
          </ng-container>
          <button
            *ngIf="day.events.length > 3"
            class="more-events-btn"
            (click)="$event.stopPropagation(); dayClick.emit(day.dateStr)"
          >
            +{{ day.events.length - 3 }} mais
          </button>
        </div>
      </div>
    </ng-container>
  </div>
</div>
